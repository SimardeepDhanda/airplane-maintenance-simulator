services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aerofleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aerofleet}
      POSTGRES_DB: ${POSTGRES_DB:-aerofleet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aerofleet} -d ${POSTGRES_DB:-aerofleet}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aerofleet}:${POSTGRES_PASSWORD:-aerofleet}@db:5432/${POSTGRES_DB:-aerofleet}
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles: ["app"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Read by the browser, so it must be the host-visible API address.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    profiles: ["app"]

volumes:
  pgdata:
