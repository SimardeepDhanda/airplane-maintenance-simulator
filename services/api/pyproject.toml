[project]
name = "aerofleet-api"
version = "0.1.0"
description = "AeroFleet FastAPI service."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "aerofleet-ml",
  "aerofleet-opt",
]

[tool.uv.sources]
aerofleet-ml = { workspace = true }
aerofleet-opt = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
