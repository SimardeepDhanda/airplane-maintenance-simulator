[project]
name = "aerofleet-opt"
version = "0.1.0"
description = "AeroFleet maintenance scheduling: heuristic baseline and CP-SAT optimizer."
requires-python = ">=3.12,<3.14"
# ortools is added in Phase 4 alongside the solver.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerofleet_opt"]
