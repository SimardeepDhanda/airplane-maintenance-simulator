[project]
name = "aerofleet-opt"
version = "0.1.0"
description = "AeroFleet maintenance scheduling: heuristic baseline and CP-SAT optimizer."
requires-python = ">=3.12,<3.14"
dependencies = ["ortools>=9.12,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerofleet_opt"]
