name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly: confirms the NASA download source still matches its checksum

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DATABASE_URL: postgresql+psycopg://aerofleet:aerofleet@localhost:5432/aerofleet
  TEST_DATABASE_URL: postgresql+psycopg://aerofleet:aerofleet@localhost:5432/aerofleet_test
  CORS_ORIGINS: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:8000

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aerofleet
          POSTGRES_PASSWORD: aerofleet
          POSTGRES_DB: aerofleet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aerofleet" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy services/api/app services/api/tests services/api/migrations ml optimization scripts
      - run: uv run pytest -m "not network"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aerofleet
          POSTGRES_PASSWORD: aerofleet
          POSTGRES_DB: aerofleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aerofleet" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run alembic -c services/api/alembic.ini upgrade head
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile app up --build -d --wait
      - name: Health and shell respond through containers
        run: |
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 2 http://localhost:8000/health
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 2 --output /dev/null http://localhost:3000/overview
      - if: always()
        run: docker compose --profile app logs --no-color | tail -200
      - if: always()
        run: docker compose --profile app down -v

  dataset:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -m network
