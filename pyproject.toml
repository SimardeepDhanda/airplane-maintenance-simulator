[project]
name = "aerofleet"
version = "0.1.0"
description = "AeroFleet workspace root (not a distributable package)."
requires-python = ">=3.12,<3.14"
dependencies = ["aerofleet-api", "aerofleet-ml", "aerofleet-opt"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx2>=2.16",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "ml", "optimization"]

[tool.uv.sources]
aerofleet-api = { workspace = true }
aerofleet-ml = { workspace = true }
aerofleet-opt = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["app", "aerofleet_ml", "aerofleet_opt", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = ["services/api", "ml/src", "optimization/src"]
explicit_package_bases = true
exclude = ["apps/web/", "build/"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["services/api/tests", "ml/tests", "optimization/tests"]
markers = [
  "db: requires a disposable PostgreSQL database (TEST_DATABASE_URL)",
  "network: downloads external data; deselected by default in CI unit runs",
]
