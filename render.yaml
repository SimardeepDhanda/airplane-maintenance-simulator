# Render Blueprint for the API only (free web service, Docker runtime).
# The database is external (Neon free tier) and the web app is on Vercel. See docs/deployment.md.
services:
  - type: web
    name: aerofleet-api
    runtime: docker
    plan: free
    region: ohio # same AWS region as the Neon database (us-east-2)
    dockerContext: .
    dockerfilePath: ./services/api/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # postgresql+psycopg://USER:PASSWORD@HOST/DB?sslmode=require
      - key: CORS_ORIGINS
        sync: false # e.g. https://aerofleet.vercel.app
      - key: ENVIRONMENT
        value: production
      - key: DB_CONNECT_TIMEOUT_S
        value: "10" # Neon computes resume from idle in about a second; leave headroom.
