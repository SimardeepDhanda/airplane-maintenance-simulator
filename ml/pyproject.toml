[project]
name = "aerofleet-ml"
version = "0.1.0"
description = "AeroFleet ML: NASA C-MAPSS data handling, training, evaluation, inference."
requires-python = ">=3.12,<3.14"
# Phase 0 needs only the standard library (dataset acquisition).
# pandas / numpy / scikit-learn / joblib are added in Phase 1.
dependencies = [
    "joblib>=1.4",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerofleet_ml"]
